allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

subprojects {
    afterEvaluate { project ->
        // AARs now require API 34+, and older Flutter plugins hard-code API 33.
        // Align every Android library module with the app compile SDK.
        if (project.hasProperty('android') && project.android.hasProperty('compileSdk')) {
            project.android.compileSdk = 37
        }
        if (project.hasProperty("kotlin")) {
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
                kotlinOptions {
                    jvmTarget = "11"
                }
            }
        }
        project.tasks.withType(JavaCompile).configureEach {
            options.compilerArgs << "-Xlint:-options" << "-Xlint:-deprecation" << "-Xlint:-unchecked"
        }
    }
}

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
